<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#0b0f14">
<meta name="description" content="GeoCam - GPS Map Camera. Photos stamped with your location, address, map thumbnail and date/time.">
<title>GeoCam - GPS Map Camera</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div id="toast" class="toast" aria-live="polite"></div>

<!-- ============ CAMERA SCREEN ============ -->
<section id="screen-camera" class="screen active" data-screen="camera">
  <div class="camera-stage">
    <div id="videoWrap" class="video-wrap">
      <video id="video" playsinline muted autoplay></video>
      <canvas id="gridOverlay" class="grid-overlay"></canvas>

      <!-- live stamp overlay approximation -->
      <div id="liveStamp" class="live-stamp theme-dark">
        <div id="liveBadge" class="live-badge">📍 GeoCam</div>
        <div class="live-stamp-row">
          <div class="live-map-thumb" id="liveMapThumb">
            <canvas id="liveMapCanvas" width="120" height="120"></canvas>
          </div>
          <div class="live-text-block">
            <div class="live-title-row">
              <span id="liveTitle" class="live-title">Locating…</span>
              <span id="liveFlag" class="live-flag"></span>
            </div>
            <div id="liveAddr" class="live-addr">Waiting for GPS…</div>
            <div id="liveCoords" class="live-coords">—</div>
            <div id="liveExtra" class="live-extra"></div>
            <div id="liveDatetime" class="live-datetime">—</div>
            <div id="liveWatermark" class="live-watermark"></div>
          </div>
        </div>
      </div>
    </div>

    <!-- top bar -->
    <div class="top-bar safe-top">
      <button id="btnSettings" class="icon-btn" aria-label="Settings">⚙️</button>
      <div class="status-pills">
        <div id="gpsBadge" class="pill pill-gps">
          <span class="dot"></span><span id="gpsBadgeText">Searching…</span>
        </div>
        <div id="orientBadge" class="pill pill-orient">Portrait · 0°</div>
      </div>
      <button id="btnGallery" class="icon-btn" aria-label="Gallery">🖼️</button>
    </div>

    <!-- zoom controls -->
    <div class="zoom-controls safe-bottom">
      <div class="zoom-chips">
        <button class="zoom-chip" data-zoom="0.5">0.5x</button>
        <button class="zoom-chip" data-zoom="1">1x</button>
        <button class="zoom-chip" data-zoom="2">2x</button>
        <button class="zoom-chip" data-zoom="3">3x</button>
      </div>
      <input id="zoomSlider" class="zoom-slider" type="range" min="0.5" max="4" step="0.1" value="1">
    </div>

    <!-- bottom controls -->
    <div class="bottom-bar safe-bottom">
      <button id="btnGrid" class="pill-btn" aria-label="Toggle grid">▦</button>
      <button id="btnShutter" class="shutter-btn" aria-label="Take photo"><span class="shutter-inner"></span></button>
      <button id="btnFlip" class="pill-btn" aria-label="Flip camera">🔄</button>
    </div>

    <div id="cameraOverlayMsg" class="camera-overlay-msg hidden"></div>
  </div>
</section>

<!-- ============ PREVIEW / REVIEW SCREEN ============ -->
<section id="screen-preview" class="screen" data-screen="preview">
  <div class="preview-stage">
    <img id="previewImg" alt="Captured photo" class="preview-img">
    <div class="preview-bar safe-bottom">
      <button id="btnDiscard" class="preview-btn">🗑️ Discard</button>
      <button id="btnShare" class="preview-btn preview-btn-primary">📤 Share</button>
      <button id="btnSave" class="preview-btn">💾 Save</button>
    </div>
  </div>
</section>

<!-- ============ SETTINGS SCREEN ============ -->
<section id="screen-settings" class="screen" data-screen="settings">
  <div class="panel">
    <div class="panel-header safe-top">
      <button id="btnSettingsBack" class="icon-btn" aria-label="Back">←</button>
      <h1>Settings</h1>
      <div class="spacer"></div>
    </div>
    <div class="panel-body">

      <form id="settingsForm">
        <div class="settings-group">
          <h2>Stamp content</h2>

          <label class="field">
            <span>Coordinate format</span>
            <select name="coordFormat">
              <option value="latlong">Lat/Long</option>
              <option value="decimal">Decimal degrees</option>
              <option value="dms">DMS (°′″)</option>
            </select>
          </label>

          <label class="field">
            <span>Map style</span>
            <select name="mapStyle">
              <option value="standard">Standard street map</option>
              <option value="satellite" selected>Satellite</option>
              <option value="none">No map thumbnail</option>
            </select>
          </label>

          <label class="field">
            <span>Date/time format</span>
            <select name="datetimeFormat">
              <option value="full">Full (weekday + GMT offset)</option>
              <option value="dmy24">DD/MM/YYYY, 24h</option>
              <option value="mdy12">MM/DD/YYYY, 12h</option>
              <option value="longmonth">Long month name</option>
              <option value="iso">ISO 8601</option>
            </select>
          </label>

          <label class="field">
            <span>Stamp theme</span>
            <select name="theme">
              <option value="dark">Dark bar</option>
              <option value="light">Light bar</option>
              <option value="minimal">Minimal (no background)</option>
            </select>
          </label>

          <label class="field">
            <span>Custom watermark / logo text</span>
            <input type="text" name="watermark" maxlength="60" placeholder="e.g. Acme Field Ops #123">
          </label>

          <label class="field">
            <span>Photo export quality</span>
            <select name="quality">
              <option value="0.7">Standard</option>
              <option value="0.9">High</option>
              <option value="1.0">Maximum</option>
            </select>
          </label>
        </div>

        <div class="settings-group">
          <h2>Visible fields</h2>
          <label class="field field-toggle"><span>Map thumbnail</span><input type="checkbox" name="showMap"></label>
          <label class="field field-toggle"><span>Place / address</span><input type="checkbox" name="showAddress"></label>
          <label class="field field-toggle"><span>Country flag</span><input type="checkbox" name="showFlag"></label>
          <label class="field field-toggle"><span>Coordinates</span><input type="checkbox" name="showCoords"></label>
          <label class="field field-toggle"><span>Plus Code</span><input type="checkbox" name="showPlusCode"></label>
          <label class="field field-toggle"><span>Date / time</span><input type="checkbox" name="showDatetime"></label>
          <label class="field field-toggle"><span>Accuracy / altitude</span><input type="checkbox" name="showAccuracy"></label>
          <label class="field field-toggle"><span>GeoCam badge</span><input type="checkbox" name="showBadge"></label>
          <label class="field field-toggle"><span>Grid lines</span><input type="checkbox" name="showGrid"></label>
        </div>

        <div class="settings-group">
          <h2>Orientation overrides</h2>

          <label class="field">
            <span>Saved photo orientation</span>
            <select name="savedOrientation">
              <option value="auto">Auto (follow how phone is held)</option>
              <option value="portrait">Always portrait</option>
              <option value="landscape">Always landscape</option>
            </select>
          </label>

          <label class="field">
            <span>Scene rotation fix</span>
            <select name="rotationFix">
              <option value="auto">Auto (use motion sensor)</option>
              <option value="none">None</option>
              <option value="90">90°</option>
              <option value="180">180°</option>
              <option value="270">270°</option>
            </select>
          </label>

          <label class="field field-toggle">
            <span>Un-mirror rear camera</span>
            <input type="checkbox" name="mirrorRearCamera">
          </label>
        </div>

        <div class="settings-group">
          <h2>Stamp sizing (export only)</h2>
          <label class="field field-slider">
            <span>Stamp margin from edge: <b id="marginVal">0</b>px</span>
            <input type="range" name="stampMargin" min="0" max="40" step="1" value="0">
          </label>
          <label class="field field-slider">
            <span>Stamp / font size: <b id="fontScaleVal">1.0</b>x</span>
            <input type="range" name="fontScale" min="0.7" max="1.5" step="0.05" value="1">
          </label>
        </div>

        <div class="settings-group">
          <h2>Diagnostics</h2>
          <pre id="diagnostics" class="diagnostics">—</pre>
        </div>

        <div class="settings-group">
          <button type="button" id="btnResetSettings" class="danger-btn">Reset to defaults</button>
        </div>
      </form>
    </div>
  </div>
</section>

<!-- ============ GALLERY SCREEN ============ -->
<section id="screen-gallery" class="screen" data-screen="gallery">
  <div class="panel">
    <div class="panel-header safe-top">
      <button id="btnGalleryBack" class="icon-btn" aria-label="Back">←</button>
      <h1>Gallery</h1>
      <div class="spacer"></div>
    </div>
    <div class="panel-body">
      <div id="galleryGrid" class="gallery-grid"></div>
      <div id="galleryEmpty" class="gallery-empty hidden">No photos yet. Take your first geotagged photo!</div>
    </div>
  </div>
</section>

<!-- ============ VIEWER SCREEN ============ -->
<section id="screen-viewer" class="screen" data-screen="viewer">
  <div class="preview-stage">
    <img id="viewerImg" alt="Saved photo" class="preview-img">
    <div class="preview-bar safe-bottom">
      <button id="btnViewerBack" class="preview-btn">← Back</button>
      <button id="btnViewerShare" class="preview-btn preview-btn-primary">📤 Share</button>
      <button id="btnViewerSave" class="preview-btn">💾 Save</button>
      <button id="btnViewerDelete" class="preview-btn preview-btn-danger">🗑️ Delete</button>
    </div>
  </div>
</section>

<canvas id="workCanvas" class="hidden-canvas"></canvas>

<script src="app.js"></script>
</body>
</html>
